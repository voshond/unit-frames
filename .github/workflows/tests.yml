name: Tests

# Runs on pull requests rather than pushes; branch protection requires the
# "LuaJIT test suite" check before merging into main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: LuaJIT test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3 zip unzip jq librsvg2-bin imagemagick fonts-dejavu-core
      - name: Set up pinned test libraries
        run: bash scripts/setup-test-libs.sh
      - name: Check out the matching Blizzard source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Gethe/wow-ui-source
          ref: 9dc84f0d3bbae1768ac3405b3716000bd93eda06 # Forever 1.60.1.70862
          path: examples/wow-ui-source-forever
          persist-credentials: false
      - name: Verify the generated spell catalogue against pinned exports
        run: python3 -B scripts/spell_catalog.py --fetch --check
      - name: Run all tests and addon syntax checks
        run: bash scripts/run-tests.sh --times -j
      - name: Cache Blizzard interface art for UI proof
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .proof-art
          key: proof-art-d23deaf8f44a7d280dc974a5c9d5321c013db59b-${{ hashFiles('tests/proof/*.lua') }}
          restore-keys: proof-art-d23deaf8f44a7d280dc974a5c9d5321c013db59b-
      - name: Render UI proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/proof.sh
      - name: Save UI proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-proof
          path: |
            .proof/*.png
            .proof/*.svg
            .proof/index.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Save spell classification audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spell-classification-audit
          path: examples/forever-spells/*/catalog.json
          if-no-files-found: ignore
          retention-days: 14
