name: Tests

# Runs on pull requests rather than pushes; branch protection requires the
# "LuaJIT test suite" check before merging into main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: LuaJIT test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit zip unzip jq
      - name: Set up pinned test libraries
        run: bash scripts/setup-test-libs.sh
      - name: Check out the matching Blizzard source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Gethe/wow-ui-source
          ref: 943764493e6b16d63ded3ab304150d1f05e58b57 # Forever 1.60.1.70338
          path: examples/wow-ui-source-forever
          persist-credentials: false
      - name: Run all tests and addon syntax checks
        run: bash scripts/run-tests.sh --times
      # TEMPORARY (PR #8): profile the slow specs; remove before merging.
      - name: Profile slow specs (temporary)
        run: |
          for spec in clickgrid_ready_check workbench_spec; do
            for mode in F l -3F; do
              echo "=== $spec, -jp=$mode ==="
              luajit -jp=$mode,/tmp/profile.txt tests/run.lua $spec > /dev/null || true
              head -n 45 /tmp/profile.txt
            done
          done
