name: Release

on:
  push:
    tags: ['v*', '[0-9]*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example 1.0.0)
        required: true
        type: string
      publish_curseforge:
        description: Also upload to CurseForge (CF_ENABLED must be true)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || (github.event.release.tag_name || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3 zip unzip jq
      - name: Set up pinned libraries
        run: bash scripts/setup-test-libs.sh
      - name: Check out the matching Blizzard source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Gethe/wow-ui-source
          ref: 172a387e3ab85b26e6640d3058d5ec1e6ccd4c63 # Forever 1.60.1.70450
          path: examples/wow-ui-source-forever
          persist-credentials: false
      - name: Verify the generated spell catalogue against pinned exports
        run: python3 -B scripts/spell_catalog.py --fetch --check
      - name: Save spell classification audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spell-classification-audit
          path: examples/forever-spells/*/catalog.json
          retention-days: 14
      - name: Run the full suite
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: bash scripts/test-tag.sh "$RELEASE_TAG"
      - name: Build installable ZIP
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installable-addon
          path: |
            .release/*.zip
            .release/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  github:
    name: Attach GitHub release files
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: installable-addon
          path: release-files
      - name: Create draft if needed and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            options=(--verify-tag --draft --generate-notes --title "UnitFrames $RELEASE_TAG")
            version="${RELEASE_TAG%%+*}"
            if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-files/*.zip release-files/*.sha256 --clobber

  curseforge:
    name: Publish to CurseForge
    needs: github
    if: ${{ !failure() && !cancelled() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_curseforge)) && vars.CF_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.release.tag_name }}
          persist-credentials: false
      - name: Download the tested ZIP from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --pattern "UnitFrames-$RELEASE_TAG.zip" --dir release-files
      - name: Upload the tested ZIP
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
          CF_CHANGELOG: ${{ github.event.release.body }}
          CF_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            CF_CHANGELOG="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            CF_PRERELEASE="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)"
            export CF_CHANGELOG CF_PRERELEASE
          fi
          bash scripts/publish-curseforge.sh "release-files/UnitFrames-$RELEASE_TAG.zip" "$RELEASE_TAG"
