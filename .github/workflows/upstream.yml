name: Upstream

# Weekly drift check against the pinned libraries, tracked in one issue:
# library updates also need scripts/fetch-libs.sh and a manual review. The
# Blizzard Forever UI source is pinned and tracked by the wow-ui-testing
# library; a new client build arrives here as a .wut-version bump.
#
# Requires the UPSTREAM_TOKEN secret: a fine-grained token for this
# repository with Contents read and Issues read/write.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  upstream:
    name: Upstream drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
    steps:
      - name: Require the upstream token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the UPSTREAM_TOKEN repository secret (see the workflow header)."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3 curl
      - name: Fetch pinned libraries
        run: bash scripts/setup-test-libs.sh
      - name: Compare pins with upstream
        id: check
        run: bash scripts/check-upstream.sh
      - name: Track library drift
        env:
          BEHIND: ${{ steps.check.outputs.libs_behind }}
          REPORT: ${{ steps.check.outputs.libs_report }}
        run: |
          title='Pinned libraries are behind upstream'
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          body="$REPORT

          Update with \`scripts/fetch-libs.sh\` (local copies and \`UnitFrames/Libs/VERSIONS.md\`) and the commits in \`scripts/setup-test-libs.sh\` (tests and releases), then review, test and install."
          if [ "$BEHIND" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'All pinned libraries match upstream again.'
          fi
