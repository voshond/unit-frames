name: Upstream

# Weekly drift check against the pinned libraries, tracked in one issue:
# library updates also need scripts/fetch-libs.sh and a manual review. The
# Blizzard Forever UI source is pinned and tracked by the wow-ui-testing
# library; a newer library release becomes a .wut-version pull request (the
# test suite reviews it).
#
# Uses GITHUB_TOKEN; the repository allows Actions to create pull requests.
# Pull requests opened with it trigger no workflows, so the job dispatches the
# test suite on the branch itself.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  upstream:
    name: Upstream drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3 curl
      - name: Fetch pinned libraries
        run: bash scripts/setup-test-libs.sh
      - name: Compare pins with upstream
        id: check
        run: bash scripts/check-upstream.sh
      - name: Track library drift
        env:
          BEHIND: ${{ steps.check.outputs.libs_behind }}
          REPORT: ${{ steps.check.outputs.libs_report }}
        run: |
          title='Pinned libraries are behind upstream'
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          body="$REPORT

          Update with \`scripts/fetch-libs.sh\` (local copies and \`UnitFrames/Libs/VERSIONS.md\`) and the commits in \`scripts/setup-test-libs.sh\` (tests and releases), then review, test and install."
          if [ "$BEHIND" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'All pinned libraries match upstream again.'
          fi
      - name: Propose the newest wow-ui-testing release
        run: |
          repository=voshond/wow-ui-testing
          pinned="$(grep -v '^[[:space:]]*\(#\|$\)' .wut-version | head -n 1 | awk '{ print $1 }')"
          refs="$(git ls-remote --tags "https://github.com/$repository.git")"
          tag="$(sed -n 's|.*refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' <<<"$refs" | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "::error::No release tags in $repository."
            exit 1
          fi
          latest="$(awk -v ref="refs/tags/$tag^{}" '$2 == ref { print $1 }' <<<"$refs")"
          [ -n "$latest" ] || latest="$(awk -v ref="refs/tags/$tag" '$2 == ref { print $1 }' <<<"$refs")"
          printf '\n| wow-ui-testing | `%s` | `%s` @ `%s` | %s |\n' "${pinned:0:7}" "$tag" "${latest:0:7}" \
            "$([ "$pinned" = "$latest" ] && echo current || echo behind)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pinned" = "$latest" ]; then exit 0; fi
          printf '%s # %s\n' "$latest" "$tag" > .wut-version
          branch=upstream/wow-ui-testing
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add .wut-version
          git commit -q -m "Bump wow-ui-testing to $tag" \
            -m "Generated by the Upstream workflow from $repository $latest."
          git push -q --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "Bump wow-ui-testing to $tag" --body "## Summary
          - Pins \`.wut-version\` to $repository \`$tag\` (\`$latest\`).
          - The library's pinned Blizzard client source, API snapshot and atlas table come with it.

          Review the [library changes](https://github.com/$repository/compare/$pinned...$latest) and the spell catalogue check. Install and check the client before merging when the build changes behaviour."
          fi
          gh workflow run tests.yml --ref "$branch"
