name: Upstream

# Weekly drift check against Blizzard's Forever UI source and the pinned
# libraries. A newer Forever source becomes a pull request (re-pinned
# workflows and a regenerated API snapshot; the test suite reviews it).
# Library drift is tracked in one issue: library updates also need
# scripts/fetch-libs.sh and a manual review.
#
# Requires the UPSTREAM_TOKEN secret: a fine-grained token for this
# repository with Contents, Pull requests, Issues and Workflows read/write.
# Pull requests opened with it trigger the test suite, unlike GITHUB_TOKEN.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  upstream:
    name: Upstream drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
    steps:
      - name: Require the upstream token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the UPSTREAM_TOKEN repository secret (see the workflow header)."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Compare pins with upstream
        id: check
        run: bash scripts/check-upstream.sh
      - name: Propose the newest Forever source
        if: steps.check.outputs.source_behind == 'true'
        env:
          LATEST: ${{ steps.check.outputs.source_latest }}
        run: |
          bash scripts/update-blizzard-source.sh "$LATEST"
          version="$(tr -d '[:space:]' < examples/wow-ui-source-forever/version.txt)"
          branch=upstream/wow-ui-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add .github/workflows/tests.yml .github/workflows/release.yml tests/fixtures/api_snapshot.lua
          git commit -q -m "Pin Blizzard source to Forever $version" \
            -m "Generated by the Upstream workflow from Gethe/wow-ui-source $LATEST."
          git push -q --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "Pin Blizzard source to Forever $version" --body "## Summary
          - Pins tests and releases to Gethe/wow-ui-source \`$LATEST\` (Forever $version).
          - Regenerates \`tests/fixtures/api_snapshot.lua\` from it.

          Review the snapshot diff for changed or removed APIs the addons use. Install and check the client before merging when the build changes behaviour."
          fi
      - name: Track library drift
        env:
          BEHIND: ${{ steps.check.outputs.libs_behind }}
          REPORT: ${{ steps.check.outputs.libs_report }}
        run: |
          title='Pinned libraries are behind upstream'
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          body="$REPORT

          Update with \`scripts/fetch-libs.sh\` (local copies and \`UnitFrames/Libs/VERSIONS.md\`) and the commits in \`scripts/setup-test-libs.sh\` (tests and releases), then review, test and install."
          if [ "$BEHIND" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'All pinned libraries match upstream again.'
          fi
